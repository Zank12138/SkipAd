plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skipad.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.skipad.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 使用 debug 签名，生成的 release 包可直接安装到手机（仅用于个人使用）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：全部使用 Android Framework 原生 API，离线打包更稳。
dependencies {
}
