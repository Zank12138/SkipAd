# 应用版本的唯一来源（app/build.gradle 从这里读取）
# 每次发布功能更新前，必须先让 versionCode 递增，否则 Android 不允许覆盖安装。
#
# 推荐做法，在项目根目录执行：
#   gradlew.bat bumpVersion                        # versionCode +1，versionName 末位 +1
#   gradlew.bat bumpVersion -PnewVersion=1.2.0     # 自定义版本名，versionCode 仍自动 +1
#
# 覆盖安装的第二个条件是「签名一致」：本地构建与 GitHub Actions 构建默认用不同的 debug 密钥，
# 互相覆盖会失败。若想统一，执行 gradlew.bat createSigningKey 生成固定签名（详见根 build.gradle）。
versionCode=2
versionName=1.1.0
